<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实时监看 · 直播监督工作台</title>
<link rel="stylesheet" href="assets/base.css">
<style>
  /* 本页专用：只保留必要的层级，去掉多余装饰 */
  .lv-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:12px 16px;border:1px solid #E3E9F0;border-radius:10px;background:#fff;margin-bottom:14px}
  .lv-bar .n{font-size:20px;font-weight:700;line-height:1;margin-right:10px}
  .lv-bar .k{font-size:12.5px;color:#6B8199;margin-right:6px}
  .lv-bar .sep{width:1px;height:22px;background:#EDF1F6}
  .lv-bar .clock{margin-left:auto;font-size:12.5px;color:#6B8199}
  .lv-bar .clock b{color:#2C3E50;font-variant-numeric:tabular-nums}

  .lv-issue{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:8px;
    border:1px solid;margin-bottom:8px;cursor:pointer}
  .lv-issue.p0{background:#FDECEA;border-color:#F3C6C2}
  .lv-issue.p1{background:#FDF3E3;border-color:#EFD5A9}
  .lv-issue .tag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;color:#fff;flex:none;margin-top:2px}
  .lv-issue.p0 .tag{background:#C62828}
  .lv-issue.p1 .tag{background:#B8860B}
  .lv-issue .who{font-weight:600;font-size:13.5px;color:#2C3E50;flex:none}
  .lv-issue .txt{font-size:13px;color:#4A5A6A;flex:1}
  .lv-issue .go{font-size:12px;color:#6B8199;flex:none}
  .lv-issue:hover{filter:brightness(0.985)}

  .lv-list{border:1px solid #E3E9F0;border-radius:10px;overflow:hidden;background:#fff}
  .lv-row{display:grid;grid-template-columns:8px minmax(0,1.4fr) 76px 82px minmax(0,1.6fr) 84px 14px;
    align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #F0F3F7;
    cursor:pointer;font-size:13.2px}
  .lv-row:last-child{border-bottom:none}
  .lv-row:hover{background:#F7FAFD}
  .lv-dot{width:8px;height:8px;border-radius:50%}
  .lv-dot.ok{background:#2E7D32}.lv-dot.warn{background:#E0A200}.lv-dot.bad{background:#C62828}
  .lv-name{font-weight:600;color:#2C3E50;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lv-score{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:#2C3E50}
  .lv-score small{font-size:11px;font-weight:400;color:#8A99A8;margin-left:1px}
  .lv-prob{color:#4A5A6A;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lv-prob.bad{color:#C62828;font-weight:600}.lv-prob.warn{color:#8A6D3B}
  .lv-time{color:#6B8199;font-variant-numeric:tabular-nums;font-size:12.5px;text-align:right}
  .lv-arrow{color:#C7D2DD;text-align:right}
  .lv-head{display:grid;grid-template-columns:8px minmax(0,1.4fr) 76px 82px minmax(0,1.6fr) 84px 14px;gap:10px;
    padding:8px 14px;background:#FAFCFE;border-bottom:1px solid #EDF1F6;
    font-size:11.5px;color:#8A99A8;letter-spacing:.03em}
  .lv-empty{padding:28px;text-align:center;color:#8A99A8;font-size:13px}

  .lv-more{margin-top:16px;border:1px solid #E3E9F0;border-radius:10px;background:#fff}
  .lv-more>summary{padding:11px 14px;cursor:pointer;font-size:12.5px;color:#6B8199}
  .lv-more .inner{padding:0 14px 14px}

  /* 抽屉 */
  .lv-drawer{position:fixed;inset:0;z-index:80;display:none}
  .lv-drawer.open{display:block}
  .lv-mask{position:absolute;inset:0;background:rgba(24,38,52,.32)}
  .lv-panel{position:absolute;top:0;right:0;bottom:0;width:min(560px,94vw);background:#fff;
    box-shadow:-8px 0 28px rgba(20,40,60,.14);display:flex;flex-direction:column}
  .lv-panel-h{padding:16px 20px;border-bottom:1px solid #EDF1F6;display:flex;align-items:center;gap:10px}
  .lv-panel-h h3{margin:0;font-size:16px}
  .lv-panel-h .x{margin-left:auto;border:none;background:none;font-size:20px;color:#8A99A8;cursor:pointer;line-height:1}
  .lv-panel-b{padding:16px 20px;overflow:auto;flex:1}
  .lv-sec{margin-bottom:20px}
  .lv-sec h4{margin:0 0 8px;font-size:12px;letter-spacing:.06em;color:#8A99A8;font-weight:600}
  .lv-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .lv-metric{border:1px solid #EDF1F6;border-radius:8px;padding:9px 11px}
  .lv-metric .l{font-size:12px;color:#6B8199;display:flex;justify-content:space-between}
  .lv-metric .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px}
  .lv-metric .bar{height:4px;border-radius:2px;background:#EDF1F6;margin-top:7px;overflow:hidden}
  .lv-metric .bar i{display:block;height:100%;border-radius:2px}
  .lv-line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #F4F7FA;font-size:13px}
  .lv-line:last-child{border-bottom:none}
  .lv-line .r{color:#6B8199;font-variant-numeric:tabular-nums}
  .lv-alert{padding:8px 0;border-bottom:1px solid #F4F7FA;font-size:12.8px;color:#4A5A6A}
  .lv-alert b{color:#2C3E50;font-weight:600}
  .lv-alert .t{color:#8A99A8;font-variant-numeric:tabular-nums;margin-right:6px}
  .lv-none{color:#8A99A8;font-size:12.8px;padding:6px 0}
  .lv-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}

  /* 顶栏在窄屏要能换行，否则「数据过期 · 195 小时前」会被裁掉 */
  .topbar{flex-wrap:wrap;gap:8px}
  .lv-bar{flex-wrap:wrap;row-gap:6px}
  .lv-issue{flex-wrap:wrap}

  /* 手机：列表改成两行；抽屉全屏。原来 7 列定宽在 390px 下数据时间和关闭按钮都在屏幕外。 */
  @media (max-width: 820px){
    .lv-head{display:none}
    /* 窄屏用 flex 换行，不用 grid：跨列 item 的最小内容宽会把整列撑爆，右侧就被裁掉 */
    .lv-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:11px 12px}
    .lv-dot{order:1}
    .lv-name{order:2;flex:1 1 55%;min-width:0;white-space:normal;word-break:break-all}
    .lv-score{order:3;margin-left:auto}
    .lv-lv{order:4}
    .lv-prob{order:5;flex:1 1 100%;white-space:normal;font-size:12.4px;min-width:0}
    .lv-time{order:6;flex:1 1 100%;text-align:left;font-size:11.5px}
    .lv-arrow{display:none}
    .lv-bar .sep{display:none}
    /* 异常清单在手机上：房间名和问题各占一行，不然两边互相挤 */
    .lv-issue{gap:6px}
    .lv-issue .who{flex:0 0 auto}
    .lv-issue .txt{flex:1 1 100%;margin-left:0}
    .lv-issue .go{display:none}
    .lv-panel{width:100vw}
    .lv-panel-b{padding:14px 16px}
  }
  @media (max-width: 430px){
    .lv-metrics{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">监</div>
      <div><b>直播监督工作台</b><span>LIVE OPS · V1.0</span></div>
    </div>
    <a class="nav-item" href="index.html"><span class="dot"></span>总览<span class="tag">00</span></a>
    <a class="nav-item" href="system.html"><span class="dot"></span>监督体系<span class="tag">01</span></a>
    <a class="nav-item" href="scoring.html"><span class="dot"></span>状态评分<span class="tag">02</span></a>
    <a class="nav-item" href="manual.html"><span class="dot"></span>合规手册<span class="tag">03</span></a>
    <a class="nav-item" href="check.html"><span class="dot"></span>开播核对卡<span class="tag">04</span></a>
    <a class="nav-item" href="tuangou.html"><span class="dot"></span>团购版手册<span class="tag">05</span></a>
    <a class="nav-item active" href="live.html"><span class="dot"></span>实时监看<span class="tag">06</span></a>
    <div class="foot">食品类目电商直播<br>团购券 · 到店核销</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <span class="crumb">模块 06 · 实时监看</span>
      <div class="spacer"></div>
      <span id="statusBadge" class="badge">读取中…</span>
      <button class="btn sm" id="btnRefresh">刷新</button>
    </div>

    <div class="content">
      <div class="wrap-wide">

        <div class="lv-bar" id="summary">
          <span class="k">在监</span><span class="n" id="sLive">—</span>
          <div class="sep"></div>
          <span class="k">异常</span><span class="n" id="sBad" style="color:#C62828">—</span>
          <div class="sep"></div>
          <span class="k">注意</span><span class="n" id="sWarn" style="color:#B8860B">—</span>
          <span class="clock">数据时间 <b id="sClock">—</b></span>
        </div>

        <div id="issues"></div>

        <div class="lv-list">
          <div class="lv-head">
            <span></span><span>房间</span><span>得分</span><span>等级</span><span>主要问题</span><span style="text-align:right">数据时间</span><span></span>
          </div>
          <div id="roomList"><div class="lv-empty">读取中…</div></div>
        </div>

        <details class="lv-more">
          <summary>数据源与历史简报</summary>
          <div class="inner">
            <table class="tbl" style="margin-bottom:14px"><tbody id="sourceTable"></tbody></table>
            <div class="row" id="reportList" style="gap:6px;flex-wrap:wrap;margin-bottom:10px"></div>
            <div class="doc" id="reportBody" style="font-size:13.2px;line-height:1.8;max-height:320px;overflow:auto"></div>
          </div>
        </details>

      </div>
    </div>
  </div>
</div>

<div class="lv-drawer" id="drawer">
  <div class="lv-mask" id="drawerMask"></div>
  <div class="lv-panel">
    <div class="lv-panel-h">
      <h3 id="dTitle">—</h3>
      <span id="dBadge" class="badge">—</span>
      <button class="x" id="drawerClose" aria-label="关闭">×</button>
    </div>
    <div class="lv-panel-b" id="drawerBody"></div>
  </div>
</div>

<script src="assets/live.js"></script>
</body>
</html>
